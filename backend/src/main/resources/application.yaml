quarkus:
  application:
    name: o-fingidor-backend
  devservices:
    enabled: false
  live-reload:
    enabled: true
  otel:
    logs:
      enabled: true
    traces:
      enabled: true
    exporter:
      otlp:
        endpoint: http://localhost:14317
  log:
    category:
      me.davidgomesdev:
        level: DEBUG
  http:
    host: 0.0.0.0
    cors:
      enabled: true
      origins:
        - http://localhost:8080
        - http://127.0.0.1:8080
        # Dev Compose JS
        - http://localhost:8081
        - http://127.0.0.1:8081
  vertx:
    max-event-loop-execute-time: 120s
  datasource:
    db-kind: postgresql
    username: pessoa
    password: pessoa
    jdbc:
      url: jdbc:postgresql://127.0.0.1:5432/pessoa
  hibernate-orm:
    database:
      generation: none
  flyway:
    migrate-at-start: true
model:
  # options: ollama, anthropic
  chat-name: ollama
  # options: ollama, voyage
  embedding-name: ollama
  ollama:
    base-url: http://127.0.0.1:11434
    timeout: 600s
    chat-model:
      model-id: qwen3:1.7b
      temperature: 0.7
      thinking: true
    embedding-model:
      model-id: qwen3-embedding:8b
  anthropic:
    timeout: 60s
    api-key: REPLACE_ME
    chat-model:
      # options (api alias): https://platform.claude.com/docs/en/about-claude/models/overview#latest-models-comparison
      model-id: claude-haiku-4-5
      temperature: 0.7
      thinking: true
      max-tokens: 50000
  voyage:
    timeout: 60s
    api-key: REPLACE_ME
    embedding-model:
      model-id: voyage-4

retrieval:
  decision-prompt:
    asking-for-opinion: |
      A pergunta é sobre a tua opinião em algum tópico ou tema?
      Responde apenas com 'sim', 'talvez' ou 'não'.
      Pergunta: {{it}}

rag:
  max-results: 10
  min-score: 0.75
  ingestion-chunk-size: 5
  expand-query: true
  expanding-query-template: |
    Gera {{n}} versões diferentes EM PORTUGUÊS DE PORTUGAL da seguinte pergunta, para recuperar textos relevantes sobre Fernando Pessoa, os seus heterónimos e obra.
    Cada versão deve explorar um ângulo diferente: temático, biográfico, filosófico, poético ou literário.
    Quando relevante, usa nomes de heterónimos (Alberto Caeiro, Álvaro de Campos, Ricardo Reis, Bernardo Soares), títulos de obras ou vocabulário literário português da época.
    Mantém o sentido original mas varia vocabulário e estrutura para maximizar cobertura de recuperação.
    Cada versão numa linha separada. Sem enumerações, hífens ou formatação adicional.
    Pergunta: {{query}}
  qdrant:
    host: 127.0.0.1
    api-key: iLUhRXjvzDCxuDLQVa6arrl5J4A2qw6bRP0p06Euj2sAwqq9lpEsCoPU0vuDuGHk
    collection:
      name: pessoa_texts
  semantic-chunking:
    enabled: true
    similarity-threshold: 0.7
    min-chunk-size: 100
    max-chunk-size: 1000
  identification:
    min-score: 0.5
    max-candidates: 3
    # Used paired with max-candidates, as the results could be multiple segments of the same text
    over-fetch: 20
    max-chars: 400
pessoa:
  url: http://127.0.0.1:8080
  text-reader-base-url: https://pessoa.davidgomes.blog/textReader

session:
  jwt:
    secret: REPLACE_ME_WITH_A_STRONG_SECRET_AT_LEAST_32_CHARS
    ttl: PT1H
  memory:
    max-messages: 20

